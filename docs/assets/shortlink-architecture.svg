<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="880" viewBox="0 0 1200 880" role="img" aria-labelledby="title desc">
  <title id="title">抖音短链接系统架构</title>
  <desc id="desc">管理请求通过 Gateway 和 Admin 调用 Project；短链访问直接进入 Project，重定向到原始地址。Redis 缓存和分布式锁支撑跳转，ShardingSphere 访问 MySQL；Redis Stream 将访问事件交给统计消费者。Nacos 提供服务发现，聚合模式将 Admin 与 Project 合并运行。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#64748b"/></marker>
    <style>
      text{font-family:'Microsoft YaHei','PingFang SC',sans-serif;fill:#0f172a} .label{font-size:21px;font-weight:700}.sub{font-size:15px;fill:#475569}.small{font-size:14px;fill:#64748b}.line{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}.box{fill:#fff;stroke:#cbd5e1;stroke-width:1.5}
    </style>
  </defs>
  <rect width="1200" height="880" rx="24" fill="#f1f5f9"/>
  <rect x="34" y="30" width="6" height="55" rx="3" fill="#2563eb"/>
  <text x="58" y="55" font-size="28" font-weight="700">抖音短链接系统</text>
  <text x="58" y="82" class="sub">系统架构 · 管理、跳转与异步访问分析</text>
  <rect x="34" y="114" width="1132" height="143" rx="18" fill="#e8efff"/>
  <text x="55" y="142" class="small">管理链路</text>
  <rect x="60" y="160" width="255" height="76" rx="12" class="box"/>
  <text x="187" y="191" text-anchor="middle" class="label">管理控制台</text><text x="187" y="217" text-anchor="middle" class="sub">Vue 3 · Element Plus · ECharts</text>
  <rect x="400" y="160" width="275" height="76" rx="12" fill="#2563eb"/>
  <text x="537" y="191" text-anchor="middle" style="fill:white" class="label">Gateway · 8000</text><text x="537" y="217" text-anchor="middle" style="fill:#dbeafe" class="sub">管理 API 路由 · 身份校验</text>
  <rect x="805" y="160" width="305" height="76" rx="12" class="box"/>
  <text x="957" y="191" text-anchor="middle" class="label">Admin · 8002</text><text x="957" y="217" text-anchor="middle" class="sub">用户 · 分组 · 管理接口</text>
  <path d="M315 198H396" class="line"/><path d="M675 198H801" class="line"/><text x="715" y="185" class="small">API</text>
  <rect x="34" y="284" width="1132" height="148" rx="18" fill="#e5f4f2"/>
  <text x="55" y="312" class="small">跳转链路</text>
  <rect x="60" y="330" width="255" height="78" rx="12" class="box"/>
  <text x="187" y="363" text-anchor="middle" class="label">短链访问者</text><text x="187" y="389" text-anchor="middle" class="sub">打开分享地址 / 扫描二维码</text>
  <rect x="400" y="330" width="275" height="78" rx="12" fill="#0f766e"/>
  <text x="537" y="363" text-anchor="middle" style="fill:white" class="label">Project · 8001</text><text x="537" y="389" text-anchor="middle" style="fill:#ccfbf1" class="sub">创建 · 跳转 · 访问事件</text>
  <rect x="805" y="330" width="305" height="78" rx="12" class="box"/>
  <text x="957" y="363" text-anchor="middle" class="label">原始目标地址</text><text x="957" y="389" text-anchor="middle" class="sub">内容页 / 活动落地页</text>
  <path d="M315 369H396" class="line"/><path d="M675 369H801" class="line"/><text x="706" y="354" class="small">302 重定向</text>
  <path d="M957 236V270H537V326" class="line"/><text x="650" y="266" class="small">管理端远程调用</text>
  <path d="M455 408V462H187V505" class="line"/><path d="M537 408V505" class="line"/><path d="M620 408V462H957V505" class="line"/>
  <text x="204" y="453" class="small">缓存 / 锁</text><text x="548" y="477" class="small">路由与持久化</text><text x="805" y="453" class="small">投递访问事件</text>
  <rect x="60" y="510" width="255" height="95" rx="12" class="box"/>
  <text x="187" y="544" text-anchor="middle" class="label">Redis · Redisson</text><text x="187" y="572" text-anchor="middle" class="sub">缓存 · 布隆过滤器 · 分布式锁</text>
  <rect x="400" y="510" width="275" height="95" rx="12" class="box"/>
  <text x="537" y="544" text-anchor="middle" class="label">ShardingSphere</text><text x="537" y="572" text-anchor="middle" class="sub">分片存储 · 短链路由表</text>
  <rect x="805" y="510" width="305" height="95" rx="12" class="box"/>
  <text x="957" y="544" text-anchor="middle" class="label">Redis Stream</text><text x="957" y="572" text-anchor="middle" class="sub">访问事件队列</text>
  <path d="M537 605V645" class="line"/><path d="M957 605V645" class="line"/>
  <rect x="400" y="650" width="275" height="86" rx="12" class="box"/>
  <text x="537" y="685" text-anchor="middle" class="label">MySQL</text><text x="537" y="711" text-anchor="middle" class="sub">业务数据 · 访问统计</text>
  <rect x="805" y="650" width="305" height="86" rx="12" class="box"/>
  <text x="957" y="685" text-anchor="middle" class="label">统计消费者</text><text x="957" y="711" text-anchor="middle" class="sub">消息去重 · 多维统计落库</text>
  <path d="M805 693H679" class="line"/><text x="713" y="678" class="small">异步写入</text>
  <text x="60" y="660" class="sub">服务治理</text><text x="60" y="689" class="small">Nacos：注册与发现</text><text x="60" y="715" class="small">Sentinel / Redis Lua：限流</text>
  <rect x="34" y="774" width="1132" height="76" rx="14" fill="#e2e8f0"/>
  <text x="57" y="805" class="sub">本地聚合模式：Aggregation · 8003 合并 Admin 与 Project，Gateway 使用 aggregation 配置。</text>
  <text x="57" y="831" class="small">图示突出主要链路；Admin 同样访问数据库与 Redis。聚合模式下，短链访问指向 Aggregation。</text>
</svg>
